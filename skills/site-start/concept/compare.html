<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a concept</title>
<!-- Copy to concepts/index.html and fill the CONCEPTS JSON below (one entry per concepts/*.html). -->
<style>
  :root { color-scheme: light dark; --bg: #f5f4f1; --card: #fff; --ink: #161616; --muted: #6b675f; --line: #00000014; --accent: #2f5bff;
          font: 15px/1.5 system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --card: #1a1a1a; --ink: #eee; --muted: #9a9a9a; --line: #ffffff1a; --accent: #7d97ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); padding: 5vh max(16px, 4vw) 10vh; }
  header { max-width: 900px; margin-bottom: 32px; }
  h1 { font-size: clamp(28px, 3.6vw, 44px); letter-spacing: -.03em; margin: 0 0 10px; }
  header p { color: var(--muted); margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
  .card { background: var(--card); border-radius: 16px; box-shadow: 0 0 0 1px var(--line); overflow: clip; display: grid; }
  .shot { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #000; }
  .shot iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; scale: var(--s, .3); }
  .body { padding: 20px 22px 22px; display: grid; gap: 12px; }
  .tag { font: 600 11px/1 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .card h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  .sw { display: flex; gap: 6px; }
  .sw i { width: 26px; height: 26px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); }
  dl { margin: 0; display: grid; grid-template-columns: 6.5em 1fr; gap: 6px 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .why { color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions a, .actions button { padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: none; color: inherit; font: inherit; text-decoration: none; cursor: pointer; }
  .actions a:first-child { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer { margin-top: 32px; color: var(--muted); max-width: 900px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Three directions</h1>
  <p id="lead">Each one is a different way to tell the same story. Pick one, or mix them: "the story of A with the look of B".</p>
</header>
<div class="grid" id="grid"></div>
<footer>Previews are sketches (about three screens): the loader, the first screen, one signature scene and the palette. The full site grows from the one you choose.</footer>

<!-- FILL: one entry per concept -->
<script type="application/json" id="concepts">
{
  "title": "Forno — three directions",
  "lead": "Bakery site, full narrative. Each one tells the bakery's story differently.",
  "concepts": [
    { "file": "a.html", "tag": "A · closest to the brief", "name": "One Day at the Oven",
      "palette": ["#14120f", "#f2ede4", "#e0a458", "#6f8f7a"],
      "story": "Time axis: a baking day from 03:40 to closing.",
      "look": "Dark, warm, editorial serif.",
      "motion": "Loader: dawn rises behind the name. Scroll: the sun is the gauge. Pages: open like sunrise.",
      "why": "Fits because the early morning is the story. Trade-off: slow, best on desktop." }
  ]
}
</script>
<script>
  const data = JSON.parse(document.getElementById('concepts').textContent);
  document.getElementById('title').textContent = data.title || 'Three directions';
  if (data.lead) document.getElementById('lead').textContent = data.lead;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('grid').innerHTML = data.concepts.map(c => `
    <article class="card">
      <div class="shot"><iframe src="${esc(c.file)}?loader" title="Preview: ${esc(c.name)}" loading="lazy"></iframe></div>
      <div class="body">
        <span class="tag">${esc(c.tag)}</span>
        <h2>${esc(c.name)}</h2>
        <div class="sw">${(c.palette || []).map(h => `<i style="background:${esc(h)}"></i>`).join('')}</div>
        <dl><dt>Story</dt><dd>${esc(c.story)}</dd><dt>Look</dt><dd>${esc(c.look)}</dd><dt>Motion</dt><dd>${esc(c.motion)}</dd></dl>
        <p class="why">${esc(c.why)}</p>
        <div class="actions">
          <a href="${esc(c.file)}?loader" target="_blank" rel="noopener">Open full screen</a>
          <button type="button" data-phone="${esc(c.file)}">Phone size</button>
          <button type="button" data-replay>Replay</button>
        </div>
      </div>
    </article>`).join('');
  // Fit the 1280×800 preview into each card.
  const fit = () => document.querySelectorAll('.shot').forEach(s => s.style.setProperty('--s', s.clientWidth / 1280));
  addEventListener('resize', fit); fit();
  document.addEventListener('click', e => {
    const phone = e.target.closest('[data-phone]');
    if (phone) window.open(phone.dataset.phone + '?loader', '_blank', 'width=390,height=844');
    const replay = e.target.closest('[data-replay]');
    if (replay) { const f = replay.closest('.card').querySelector('iframe'); f.src = f.src; }
  });
</script>
</body>
</html>
