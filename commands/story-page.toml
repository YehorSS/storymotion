description = "Build a website with the right amount of story and motion"
prompt = """
Build a website about: {{args}}

1. Decide whether it needs a full story, one story scene, or none, and tell me in one line.
2. If there is a story, follow skills/scroll-narrative/SKILL.md from the storymotion extension: write beats.md and show it to me before writing the page.
3. Build it with motion per skills/web-motion/SKILL.md (runtime from skills/web-motion/assets/, code from its references/recipes.md).
4. Check it at 375 px and 1440 px, with reduced motion on and off, and report what you checked.
"""
