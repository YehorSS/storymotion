description = "Start a website with the right amount of story and motion — site kind, three concepts to choose from, then build"
prompt = """
Build a website about: {{args}}

1. Follow skills/site-start/SKILL.md from the storymotion extension: decide the site kind and narrative level (full / partial / none), design three different concepts from my description with live previews in concepts/ (skeleton: skills/site-start/concept/), and let me choose (or mix, or take a ready template). Wait for my choice.
2. If there is a narrative (full or partial), follow skills/scroll-narrative/SKILL.md: write beats.md and show it to me before writing the page.
3. Grow the chosen concept's preview into the full site (or start from the ready template I picked), with motion per skills/web-motion/SKILL.md and its references/recipes.md.
4. Run node skills/site-start/scripts/check.cjs on the site, fix every FAIL, look at the screenshots, and report what you checked.
"""
